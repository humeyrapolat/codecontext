[project]
name = "codecontext"
version = "0.1.0"
description = "AI-powered assistant for indexing GitHub repositories and answering codebase questions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "datasets>=4.8.5",
    "faiss-cpu>=1.13.2",
    "fastapi>=0.136.1",
    "gitpython>=3.1.50",
    "langchain>=1.2.18",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.3",
    "langchain-groq>=1.1.2",
    "langchain-huggingface>=1.2.2",
    "langfuse>=4.6.1",
    "python-dotenv>=1.2.2",
    "ragas>=0.4.3",
    "sentence-transformers>=5.4.1",
    "uvicorn>=0.46.0",
]
